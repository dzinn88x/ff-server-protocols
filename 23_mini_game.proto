syntax = "proto3";

// Categoria: 23_mini_game
// Total: 19 segments

// Message: proto.EMiniGame
message EMiniGame {
    // Sem campos definidos no dump
}

// Message: proto.CSPlayerBooyahChessInfo
message CSPlayerBooyahChessInfo {
    System_UInt64 account_id = 1;
    proto_EMiniGame_GameStatus game_status = 2;
    System_UInt32 player_index = 3;
    System_UInt32 current_step = 4;
    System_UInt32 current_weapon = 5;
    System_UInt32 booyah_times = 6;
    proto_Chessboard chessboard = 7;
    proto_Circle current_circle = 8;
    System_UInt32 current_reward_cnt = 9;
